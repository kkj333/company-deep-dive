[project]
name = "company-deep-dive"
version = "0.1.0"
description = "企業詳細分析レポートアプリ"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.17.0",
    "pdfplumber>=0.10.0",
]


[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/venv/*", "*/.venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Black互換のフォーマット設定
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
